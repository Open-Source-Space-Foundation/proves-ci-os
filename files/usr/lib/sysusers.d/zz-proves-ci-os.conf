# dialout membership is added in the Containerfile (static group in /usr/lib/group).
# Named zz- so it sorts after systemd.conf, which creates systemd-journal
# that `m` below needs (ADR 0005, 0007).
g plugdev -
u runner - "GitHub Actions runner" /var/lib/runner /usr/sbin/nologin
u ops - "Shared ops account" /var/home/ops /bin/bash
m ops wheel
m ops plugdev
m ops systemd-journal
m ops runner
