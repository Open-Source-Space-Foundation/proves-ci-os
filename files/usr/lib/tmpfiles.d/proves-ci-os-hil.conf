# Paths the core reference workflow hardcodes under the runner's home (ADR 0007).
d /var/lib/runner 0750 runner runner -
d /var/lib/runner/openocd 0750 runner runner -
d /var/lib/runner/openocd/src 0750 runner runner -
L+ /var/lib/runner/openocd/src/openocd - - - - /usr/local/bin/openocd
L+ /var/lib/runner/openocd/tcl - - - - /usr/local/share/openocd/scripts
L+ /var/lib/runner/korad_control - - - - /usr/local/lib/korad_control
