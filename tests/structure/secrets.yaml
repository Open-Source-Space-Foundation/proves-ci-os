schemaVersion: "2.0.0"

# CONTEXT.md: tokens, auth keys and passwords are never baked into the Image.
commandTests:
  - name: no private key under /etc or /usr
    command: sh
    args:
      - -c
      - |
        hits=$(grep -rIlE -e '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' /etc /usr 2>/dev/null || true)
        test -z "$hits" || { echo "$hits" >&2; exit 1; }
  - name: no GitHub token or Tailscale auth key under /etc or /usr
    command: sh
    args:
      - -c
      - |
        hits=$(grep -rIlE -e '(gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|tskey-[a-z]+-[A-Za-z0-9-]{10,})' /etc /usr 2>/dev/null || true)
        test -z "$hits" || { echo "$hits" >&2; exit 1; }
  - name: no ssh authorized_keys or ssh keys baked in
    command: sh
    args: ["-c", "test -z \"$(find /etc /usr /var/home /var/lib/runner -name authorized_keys -o -name id_rsa -o -name id_ed25519 -o -name id_ecdsa -o -name 'ssh_host_*_key' 2>/dev/null)\""]
  - name: no runner registration state baked in
    command: sh
    args: ["-c", "test ! -e /var/lib/runner/actions-runner/.runner && test ! -e /var/lib/runner/actions-runner/.credentials"]
